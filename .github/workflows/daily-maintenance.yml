name: Daily Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * *"

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend healthcheck
        run: curl --fail-with-body --silent --show-error "$BACKEND_HEALTHCHECK_URL"
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}

      - name: Trigger daily maintenance
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "x-ops-secret: $OPS_CRON_SECRET" \
            "$BACKEND_DAILY_MAINTENANCE_URL"
        env:
          BACKEND_DAILY_MAINTENANCE_URL: ${{ secrets.BACKEND_DAILY_MAINTENANCE_URL }}
          OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
