name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run backend test suite
        run: python -m pytest tests -v --ignore=tests/integration --ignore=tests/performance

  integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run backend integration suite
        run: python -m pytest tests/integration -v --tb=short

      - name: Dump integration Docker logs
        if: failure()
        run: |
          docker compose -f docker-compose.integration.yml -p girospesa-itest ps -a || true
          docker compose -f docker-compose.integration.yml -p girospesa-itest logs --no-color --tail=200 || true
